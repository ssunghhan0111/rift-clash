<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Open Graph card: what a pasted RIFT CLASH link looks like in Discord,
       iMessage or a tweet. 1200x630 is the size every one of them crops to. -->
  <defs>
    <radialGradient id="sky" cx="0.5" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#1e2c3d"/>
      <stop offset="1" stop-color="#080c12"/>
    </radialGradient>
    <linearGradient id="rift" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc46b"/>
      <stop offset="0.5" stop-color="#f08a2a"/>
      <stop offset="1" stop-color="#c85a10"/>
    </linearGradient>
    <linearGradient id="shard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9df4ff"/>
      <stop offset="0.55" stop-color="#4fd6e8"/>
      <stop offset="1" stop-color="#1f7f8c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f08a2a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f08a2a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>
  <g opacity="0.5">
    <circle cx="120" cy="90" r="2.2" fill="#cfdcea"/><circle cx="300" cy="52" r="1.6" fill="#cfdcea"/>
    <circle cx="520" cy="120" r="1.8" fill="#cfdcea"/><circle cx="980" cy="70" r="2.4" fill="#cfdcea"/>
    <circle cx="1120" cy="180" r="1.7" fill="#cfdcea"/><circle cx="760" cy="42" r="1.5" fill="#cfdcea"/>
    <circle cx="180" cy="520" r="1.9" fill="#cfdcea"/><circle cx="1060" cy="470" r="2.1" fill="#cfdcea"/>
  </g>

  <!-- planet limb along the bottom, so it reads as "space RTS" instantly -->
  <ellipse cx="600" cy="920" rx="900" ry="420" fill="#16263a"/>
  <ellipse cx="600" cy="930" rx="900" ry="420" fill="none" stroke="#2b4763" stroke-width="4"/>
  <ellipse cx="430" cy="740" rx="150" ry="52" fill="#1b3048" opacity="0.8"/>
  <ellipse cx="820" cy="770" rx="190" ry="60" fill="#1b3048" opacity="0.8"/>

  <!-- the mark -->
  <g transform="translate(140,175) scale(0.55)">
    <ellipse cx="256" cy="256" rx="190" ry="215" fill="url(#glow)"/>
    <path d="M262 40 L214 196 L268 214 L206 350 L252 356 L196 472
             L300 330 L246 320 L318 178 L258 164 Z" fill="url(#rift)"/>
    <path d="M256 178 L318 256 L256 396 L194 256 Z" fill="url(#shard)"/>
    <path d="M256 178 L318 256 L256 396 Z" fill="#0a0e14" opacity="0.22"/>
    <path d="M256 178 L288 256 L256 300 L224 256 Z" fill="#eaffff" opacity="0.55"/>
  </g>

  <text x="450" y="270" font-family="ui-monospace, 'SF Mono', Consolas, monospace"
        font-size="96" font-weight="700" letter-spacing="14" fill="#f08a2a">RIFT<tspan fill="#3a7fd5">CLASH</tspan></text>
  <text x="456" y="330" font-family="system-ui, sans-serif" font-size="30" fill="#cfdcea">
    Real-time strategy. Six planets. No download.
  </text>
  <text x="456" y="382" font-family="system-ui, sans-serif" font-size="24" fill="#7b8ea3">
    1v1 · 2v2 · co-op Survival · daily challenge · voice chat
  </text>
  <rect x="456" y="424" width="342" height="60" rx="8" fill="#f08a2a"/>
  <text x="627" y="464" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="25" font-weight="700" fill="#10171f">Play in your browser</text>

  <text x="1150" y="592" text-anchor="end" font-family="system-ui, sans-serif"
        font-size="20" fill="#5d6f83">Made in Jayden Game Studio</text>
</svg>
